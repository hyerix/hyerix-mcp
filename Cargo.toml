[package]
name = "hyerix-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Hyerix's MCP surface for NATS — a stdio Model Context Protocol server that exposes JetStream, KV, and cluster operations to AI agents."
authors = ["Hyerix <hello@hyerix.ai>"]
license = "Apache-2.0"
homepage = "https://hyerix.ai"
repository = "https://github.com/hyerix/hyerix-mcp"
readme = "README.md"
keywords = ["mcp", "nats", "jetstream", "ai", "agent"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "hyerix_mcp_lib"
path = "src/lib.rs"

[[bin]]
name = "hyerix-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "1.7", features = ["server", "macros", "transport-io"] }
async-nats = "0.47"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
base64 = "0.22"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
async-nats = "0.47"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
